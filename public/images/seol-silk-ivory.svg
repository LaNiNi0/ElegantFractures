<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1560" viewBox="0 0 720 1560" role="img" aria-label="은은한 상아색과 샴페인 골드의 설가 배경">
  <defs>
    <linearGradient id="silk" x1="0" y1="0" x2="0.93" y2="1">
      <stop offset="0" stop-color="#FBFAF6"/>
      <stop offset=".40" stop-color="#F5F4ED"/>
      <stop offset=".72" stop-color="#F0F0E7"/>
      <stop offset="1" stop-color="#E9EADC"/>
    </linearGradient>
    <radialGradient id="light" cx=".72" cy=".10" r=".93">
      <stop offset="0" stop-color="#F8EACA" stop-opacity=".54"/>
      <stop offset=".45" stop-color="#F9F5E6" stop-opacity=".10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist" cx=".01" cy=".92" r=".76">
      <stop offset="0" stop-color="#C3D0BE" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#DCE4D4" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#D1C39E"/>
      <stop offset=".35" stop-color="#AB9A72"/>
      <stop offset=".6" stop-color="#D8CEB2"/>
      <stop offset="1" stop-color="#A0A992"/>
    </linearGradient>
    <pattern id="weave" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 0 H18" stroke="#9F9E83" stroke-width=".65" opacity=".035"/>
      <path d="M0 0 V18" stroke="#FFFFFF" stroke-width=".6" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="720" height="1560" fill="url(#silk)"/>
  <rect width="720" height="1560" fill="url(#light)"/>
  <rect width="720" height="1560" fill="url(#mist)"/>
  <rect width="720" height="1560" fill="url(#weave)"/>
  <!-- Monumental rectilinear frame motifs inspired by traditional joinery. -->
  <g fill="none" stroke="url(#metal)" stroke-linejoin="miter" stroke-width="2.2" opacity=".18">
    <path d="M755 48 H595 V172 H720 M595 172 H502 V270 H720"/>
    <path d="M755 78 H625 V201 H720 M625 201 H538 V291 H720" stroke-width=".9"/>
    <path d="M-40 1515 H128 V1377 H0 M128 1377 H228 V1294 H0"/>
    <path d="M-40 1484 H98 V1347 H0 M98 1347 H201 V1264 H0" stroke-width=".9"/>
  </g>
  <!-- Very broad satin folds; kept to the perimeter to leave interface text legible. -->
  <g fill="none" stroke="#B2A47D" stroke-linecap="round">
    <path d="M755 320 C600 429 682 565 540 700 S448 923 725 1135" stroke-width="3" opacity=".075"/>
    <path d="M762 385 C645 484 689 613 575 754 S499 953 749 1166" stroke-width="1.4" opacity=".105"/>
    <path d="M-75 845 C100 953 75 1099 165 1203 S262 1361 28 1508" stroke-width="2.1" opacity=".055"/>
  </g>
  <!-- Signet-like framing, not an emblem illustration. -->
  <g stroke="#A5A98E" fill="none" stroke-width="1.1" opacity=".13">
    <path d="M33 330 V65 H284" />
    <path d="M687 1219 V1486 H437" />
    <path d="M49 277 V83 H239" stroke-width=".65"/>
    <path d="M670 1273 V1469 H483" stroke-width=".65"/>
  </g>
  <path d="M271 49 H446" stroke="#B5A178" stroke-width="1" opacity=".14"/>
  <path d="M269 1510 H448" stroke="#B5A178" stroke-width="1" opacity=".14"/>
</svg>