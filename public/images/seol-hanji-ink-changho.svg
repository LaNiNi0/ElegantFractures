<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1560" viewBox="0 0 720 1560" role="img" aria-label="설가의 창호 문살과 한지 위에 송녹색·먹빛·옅은 황금빛이 번진 전통 현대식 배경">
 <defs>
  <linearGradient id="paper" x1=".1" y1="0" x2=".86" y2="1">
   <stop offset="0" stop-color="#F8F8F2"/>
   <stop offset=".35" stop-color="#F6F6F0"/>
   <stop offset=".7" stop-color="#F3F4EE"/>
   <stop offset="1" stop-color="#F0F1E9"/>
  </linearGradient>
  <radialGradient id="sun" cx=".79" cy=".08" r=".81">
   <stop offset="0" stop-color="#F7EDD1" stop-opacity=".47"/>
   <stop offset=".46" stop-color="#FFFDF7" stop-opacity=".15"/>
   <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="soft-center" cx=".52" cy=".51" r=".63">
   <stop offset="0" stop-color="#FFFFFF" stop-opacity=".62"/>
   <stop offset=".66" stop-color="#FFFFFF" stop-opacity=".11"/>
   <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="paper-grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
   <feTurbulence type="fractalNoise" baseFrequency=".53" numOctaves="3" seed="12" stitchTiles="stitch" result="noise"/>
   <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
   <feComponentTransfer in="grey"><feFuncA type="linear" slope=".16"/></feComponentTransfer>
  </filter>
  <filter id="ink-bloom" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
   <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="8" result="turb"/>
   <feDisplacementMap in="SourceGraphic" in2="turb" scale="70" xChannelSelector="R" yChannelSelector="G" result="wash"/>
   <feGaussianBlur in="wash" stdDeviation="32"/>
  </filter>
  <filter id="soft-ink" x="-70%" y="-70%" width="240%" height="240%">
   <feGaussianBlur stdDeviation="58"/>
  </filter>
  <linearGradient id="top-fade" x1="0" y1="0" x2=".66" y2="1">
   <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
   <stop offset=".62" stop-color="#FFFFFF" stop-opacity=".68"/>
   <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bottom-fade" x1=".3" y1="1" x2=".78" y2="0">
   <stop offset="0" stop-color="#FFFFFF" stop-opacity=".90"/>
   <stop offset=".60" stop-color="#FFFFFF" stop-opacity=".65"/>
   <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <mask id="panel-top">
   <rect x="385" y="15" width="340" height="690" fill="url(#top-fade)"/>
  </mask>
  <mask id="panel-bottom">
   <rect x="-35" y="905" width="350" height="690" fill="url(#bottom-fade)"/>
  </mask>
  <pattern id="joinery" x="0" y="0" width="168" height="168" patternUnits="userSpaceOnUse">
   <g fill="none" stroke="#8E8B71" stroke-linecap="square">
    <rect x="1" y="1" width="166" height="166" stroke-width="1.7" opacity=".55"/>
    <path d="M56 1V56H1M112 1V56H167M56 167V112H1M112 167V112H167" stroke-width="2.2"/>
    <path d="M56 56H112V112H56Z M84 56V112 M56 84H112" stroke-width="1.65"/>
    <path d="M1 84H56 M112 84H167 M84 1V56 M84 112V167" stroke-width="1.2"/>
   </g>
  </pattern>
 </defs>
 <!-- Beautifully bright paper foundation with only a whisper of natural fibre. -->
 <rect width="720" height="1560" fill="url(#paper)"/>
 <rect width="720" height="1560" fill="url(#sun)"/>
 <rect width="720" height="1560" filter="url(#paper-grain)" opacity=".38"/>
 <!-- Diluted pine-ink green and fading ochre, as pigment absorbed by hanji. -->
 <g filter="url(#ink-bloom)">
  <path d="M770 -100C636 -77 579 21 512 106S429 263 501 332C587 418 701 392 803 440L858 14Z" fill="#446B59" opacity=".36"/>
  <path d="M812 52C699 97 585 95 529 220C483 323 555 425 742 476L816 432Z" fill="#758675" opacity=".25"/>
  <path d="M691 -81C556 -33 495 26 485 156C482 242 605 289 743 286L778 -42Z" fill="#AF9762" opacity=".24"/>
  <path d="M-97 1103C41 1027 126 1130 154 1228C193 1376 262 1483 158 1624L-121 1613Z" fill="#516E5C" opacity=".33"/>
  <path d="M-110 1253C31 1148 142 1245 221 1345C293 1435 275 1557 227 1660L-111 1647Z" fill="#A9915F" opacity=".23"/>
  <path d="M-75 1043C79 1040 125 1151 123 1254S12 1440 -96 1455Z" fill="#766071" opacity=".15"/>
 </g>
 <g filter="url(#soft-ink)">
  <ellipse cx="646" cy="137" rx="186" ry="153" fill="#557D6B" opacity=".18"/>
  <ellipse cx="635" cy="321" rx="125" ry="139" fill="#A9A071" opacity=".12"/>
  <ellipse cx="51" cy="1376" rx="206" ry="198" fill="#648271" opacity=".16"/>
  <ellipse cx="60" cy="1516" rx="170" ry="136" fill="#C0A46A" opacity=".15"/>
 </g>
 <!-- Pale open centre so icon labels, notifications and widgets stay legible. -->
 <rect width="720" height="1560" fill="url(#soft-center)"/>
 <!-- Incomplete corner window panels instead of literal pine/crane illustrations. -->
 <g mask="url(#panel-top)" opacity=".42">
  <rect x="436" y="25" width="336" height="618" fill="url(#joinery)"/>
  <rect x="438" y="27" width="330" height="616" fill="none" stroke="#917F57" stroke-width="3"/>
  <path d="M454 41H741M454 626H741" stroke="#A79772" stroke-width="1.3" fill="none"/>
 </g>
 <g mask="url(#panel-bottom)" opacity=".32">
  <rect x="-117" y="924" width="359" height="646" fill="url(#joinery)"/>
  <rect x="-111" y="927" width="350" height="640" fill="none" stroke="#6A7B6B" stroke-width="2.9"/>
 </g>
 <!-- Two restrained ink-brush accent gestures, only at the margins. -->
 <g fill="none" stroke-linecap="round">
  <path d="M698 376C656 438 618 457 589 521" stroke="#5B7564" stroke-width="5" opacity=".09"/>
  <path d="M-17 1071C75 1101 86 1176 111 1236" stroke="#886F5F" stroke-width="5" opacity=".08"/>
 </g>
</svg>